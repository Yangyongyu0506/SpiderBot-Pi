launch:
  # Hardware
  - node:
      pkg: hardware_interface_py
      exec: busservo
      name: busservo_node
      output: screen
  - node:
      pkg: hardware_interface_py
      exec: buzzer
      name: buzzer_node
      output: screen
  - node:
      pkg: hardware_interface_py
      exec: i2c
      name: i2c_node
      output: screen
  - node:
      pkg: visiontools_py
      exec: camera
      name: camera_node
      output: screen
      namespace: camera
  # Proc
  - node:
      pkg: image_proc
      exec: image_proc
      name: image_proc_node
      output: screen
      namespace: camera
  - node:
      pkg: imu_complementary_filter
      exec: complementary_filter_node
      name: imu_filter_node
      output: screen